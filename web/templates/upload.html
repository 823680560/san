{% extends "base.html" %}
{% block title %}上传文件 - 环卫行业智能问答系统{% endblock %}
{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <h2 class="mb-4"><i class="bi bi-upload"></i> 上传文件</h2>

        <!-- 上传区域 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="upload-zone" id="uploadZone">
                    <i class="bi bi-cloud-arrow-up display-3 text-muted"></i>
                    <p class="mt-3 mb-2">拖拽文件到此处，或点击选择文件</p>
                    <p class="text-muted small">支持格式: .xlsx, .xls, .json, .csv, .pdf, .txt, .doc, .docx</p>
                    <input type="file" id="fileInput" class="d-none" multiple accept=".xlsx,.xls,.json,.csv,.pdf,.txt,.doc,.docx">
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        <i class="bi bi-folder2-open"></i> 选择文件
                    </button>
                </div>
            </div>
        </div>

        <!-- 上传进度 -->
        <div id="uploadProgress" class="d-none mb-4">
            <div class="progress">
                <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar" style="width: 0%">0%</div>
            </div>
        </div>

        <!-- 上传结果 -->
        <div id="uploadResult" class="d-none mb-4"></div>

        <!-- 已上传文件列表 -->
        <div class="card shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-files"></i> 已上传文件</h5>
                <button class="btn btn-sm btn-outline-primary" onclick="refreshFileList()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div id="fileList">
                    <div class="text-center text-muted py-3">
                        <div class="spinner-border spinner-border-sm" role="status"></div>
                        加载中...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
// 文件上传区域交互
const uploadZone = document.getElementById('uploadZone');
const fileInput = document.getElementById('fileInput');

uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
});

uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('drag-over');
});

uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const files = e.dataTransfer.files;
    uploadFiles(files);
});

fileInput.addEventListener('change', () => {
    uploadFiles(fileInput.files);
});

async function uploadFiles(files) {
    const progressDiv = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const resultDiv = document.getElementById('uploadResult');

    progressDiv.classList.remove('d-none');
    resultDiv.classList.add('d-none');

    let successCount = 0;
    let failCount = 0;
    const total = files.length;

    for (let i = 0; i < total; i++) {
        const file = files[i];
        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData,
            });

            if (response.ok) {
                successCount++;
            } else {
                const err = await response.json();
                console.error(`上传 ${file.name} 失败:`, err);
                failCount++;
            }
        } catch (err) {
            console.error(`上传 ${file.name} 失败:`, err);
            failCount++;
        }

        const progress = Math.round(((i + 1) / total) * 100);
        progressBar.style.width = progress + '%';
        progressBar.textContent = progress + '%';
    }

    progressDiv.classList.add('d-none');

    resultDiv.classList.remove('d-none');
    if (failCount === 0) {
        resultDiv.innerHTML = `<div class="alert alert-success">全部 ${successCount} 个文件上传成功！</div>`;
    } else {
        resultDiv.innerHTML = `<div class="alert alert-warning">${successCount} 个成功，${failCount} 个失败</div>`;
    }

    refreshFileList();
}

async function refreshFileList() {
    const fileListDiv = document.getElementById('fileList');
    fileListDiv.innerHTML = '<div class="text-center text-muted py-3"><div class="spinner-border spinner-border-sm" role="status"></div> 加载中...</div>';

    try {
        const response = await fetch('/api/files');
        const data = await response.json();

        if (!data.success || data.files.length === 0) {
            fileListDiv.innerHTML = '<div class="text-center text-muted py-3">暂无文件</div>';
            return;
        }

        const formatSize = (bytes) => {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        };

        const formatTime = (ts) => {
            const d = new Date(ts * 1000);
            return d.toLocaleString('zh-CN');
        };

        const getIcon = (ext) => {
            const icons = {
                '.xlsx': 'bi-file-earmark-excel',
                '.xls': 'bi-file-earmark-excel',
                '.json': 'bi-file-earmark-code',
                '.csv': 'bi-file-earmark-spreadsheet',
                '.pdf': 'bi-file-earmark-pdf',
                '.txt': 'bi-file-earmark-text',
                '.doc': 'bi-file-earmark-word',
                '.docx': 'bi-file-earmark-word',
            };
            return icons[ext] || 'bi-file-earmark';
        };

        const getColor = (ext) => {
            const colors = {
                '.xlsx': 'text-success',
                '.xls': 'text-success',
                '.json': 'text-warning',
                '.csv': 'text-success',
                '.pdf': 'text-danger',
                '.txt': 'text-primary',
                '.doc': 'text-primary',
                '.docx': 'text-primary',
            };
            return colors[ext] || 'text-secondary';
        };

        let html = '<div class="list-group">';
        data.files.forEach(f => {
            html += `
                <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <div>
                        <i class="bi ${getIcon(f.ext)} ${getColor(f.ext)} me-2"></i>
                        <strong>${f.name}</strong>
                        <small class="text-muted ms-2">${formatSize(f.size)}</small>
                        <br>
                        <small class="text-muted">${formatTime(f.modified)}</small>
                    </div>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteFile('${f.name}')">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            `;
        });
        html += '</div>';
        fileListDiv.innerHTML = html;
    } catch (err) {
        fileListDiv.innerHTML = `<div class="alert alert-danger">加载文件列表失败: ${err.message}</div>`;
    }
}

async function deleteFile(fileName) {
    if (!confirm(`确定删除 ${fileName} 吗？`)) return;

    try {
        const response = await fetch(`/api/files/${encodeURIComponent(fileName)}`, {
            method: 'DELETE',
        });
        const data = await response.json();
        if (data.success) {
            refreshFileList();
        } else {
            alert('删除失败: ' + data.detail);
        }
    } catch (err) {
        alert('删除失败: ' + err.message);
    }
}

// 页面加载时刷新文件列表
refreshFileList();
</script>
{% endblock %}
